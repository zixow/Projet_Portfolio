<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projets — Nathan THIBAULT · Portfolio BTS SIO SLAM</title>
    <meta name="description" content="Projets de Nathan THIBAULT : PixelStar (site web PHP / MySQL) et Caillou Tour (application mobile Flutter).">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#f1e9dc">
    <!-- Aperçu quand le lien du portfolio est partagé (LinkedIn, Discord, Messenger…) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Portfolio de Nathan THIBAULT">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:title" content="Projets — Nathan THIBAULT · Portfolio BTS SIO SLAM">
    <meta property="og:description" content="Projets de Nathan THIBAULT : PixelStar (site web PHP / MySQL) et Caillou Tour (application mobile Flutter).">
    <meta property="og:url" content="https://zixow.github.io/Projet_Portfolio/projets.html">
    <meta property="og:image" content="https://zixow.github.io/Projet_Portfolio/assets/apercu-partage.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Polices et icônes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/devicon.min.css">

    <!-- Styles communs à toutes les pages, puis styles propres à cette page -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/mise-en-page.css">
    <link rel="stylesheet" href="css/projets.css">

    <!-- Applique le thème enregistré avant l'affichage (évite le flash) -->
    <script>
        (function () {
          try {
            var theme = localStorage.getItem('theme');
            if (theme) document.documentElement.setAttribute('data-theme', theme);
          } catch (e) { /* stockage indisponible : thème clair par défaut */ }
        })();
    </script>
</head>
<body data-page="projets">

<!-- En-tête : ajouté par js/composants.js (écrit une seule fois pour toutes les pages) -->
<div id="entete-site"></div>

<main>

    <!-- ============ PROJETS ============ -->
    <section class="section section--alt" id="projets">
        <div class="container">
            <header class="section__header reveal">
                <span class="section__label">Projets</span>
                <h2 class="section__title">Mes <span class="gradient-text">projets</span></h2>
                <p class="section__subtitle">Projets réalisés pendant mon BTS SIO. Cliquez sur « Détails » pour en savoir plus, ou sur « Code » pour voir le code sur GitHub.</p>
            </header>

            <div class="filters" id="projects-filters" role="group" aria-label="Filtrer les projets">
                <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">Tous</button>
                <button class="filter-btn" type="button" data-filter="web" aria-pressed="false">Web</button>
                <button class="filter-btn" type="button" data-filter="mobile" aria-pressed="false">Mobile</button>
            </div>

            <!-- Projets lus dans la base de données (tables projet, technologie, projet_rubrique…) :
                 cartes et fenêtres de détails créées par js/projets.js -->
            <div class="projects__grid" id="liste-projets"></div>
        </div>
    </section>

</main>

<!-- Pied de page : ajouté par js/composants.js -->
<div id="pied-site"></div>

<!-- Fenêtre modale des projets -->
<div class="modal" id="project-modal" role="dialog" aria-modal="true" aria-label="Détails du projet" aria-hidden="true">
    <div class="modal__box">
        <button class="icon-btn modal__close" type="button" aria-label="Fermer"><i class="fa-solid fa-xmark"></i></button>
        <div class="modal__content" id="modal-content"></div>
    </div>
</div>

<script src="js/composants.js"></script>
<script src="js/commun.js"></script>
<script src="data/contenu.js"></script>
<script src="js/donnees.js"></script>
<script src="js/projets.js"></script>
</body>
</html>
